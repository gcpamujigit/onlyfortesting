<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon - iphikabbandung.org</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
        color: #2e7d32;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 600px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 3em;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.2em;
        margin-bottom: 30px;
      }
      .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .time-unit {
        background: #4caf50;
        color: white;
        padding: 20px;
        border-radius: 8px;
        min-width: 80px;
      }
      .time-unit span {
        display: block;
        font-size: 2em;
        font-weight: bold;
      }
      .time-unit small {
        font-size: 0.8em;
      }
      footer {
        font-size: 0.9em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Coming Soon</h1>
      <p>
        Kami sedang mempersiapkan sesuatu yang menarik untuk Anda di
        <strong>iphikabbandung.org</strong>. Tetap pantau!
      </p>
      <div class="countdown" id="countdown">
        <div class="time-unit">
          <span id="days">00</span>
          <small>Hari</small>
        </div>
        <div class="time-unit">
          <span id="hours">00</span>
          <small>Jam</small>
        </div>
        <div class="time-unit">
          <span id="minutes">00</span>
          <small>Menit</small>
        </div>
        <div class="time-unit">
          <span id="seconds">00</span>
          <small>Detik</small>
        </div>
      </div>
      <footer>&copy; 2026 iphikabbandung.org</footer>
    </div>

    <script>
      // Set the date we're counting down to (24 hours from now)
      const countDownDate = new Date().getTime() + 24 * 60 * 60 * 1000;

      // Update the count down every 1 second
      const x = setInterval(function () {
        // Get today's date and time
        const now = new Date().getTime();

        // Find the distance between now and the count down date
        const distance = countDownDate - now;

        // Time calculations for days, hours, minutes and seconds
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display the result in the element with id
        document.getElementById("days").innerHTML = days
          .toString()
          .padStart(2, "0");
        document.getElementById("hours").innerHTML = hours
          .toString()
          .padStart(2, "0");
        document.getElementById("minutes").innerHTML = minutes
          .toString()
          .padStart(2, "0");
        document.getElementById("seconds").innerHTML = seconds
          .toString()
          .padStart(2, "0");

        // If the count down is finished, write some text
        if (distance < 0) {
          clearInterval(x);
          document.getElementById("countdown").innerHTML =
            "<p>Waktu telah habis!</p>";
        }
      }, 1000);
    </script>
  </body>
</html>
