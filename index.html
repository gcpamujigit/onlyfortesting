<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ===== TITLE ===== -->
    <title>Document</title>

    <!-- ===== CSS LINK ===== -->
    <link rel="stylesheet" href="css/stylemodified.css" />

    <!-- ===== REMIX ICONS ===== -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
    <header>
      <div class="left-nav">
        <div class="logo">
          <img src="img/logo.png" alt="" />
        </div>
        <div class="hamburger"><i class="ri-menu-line"></i></div>
        <nav>
          <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONTACT</a></li>
          </ul>
        </nav>
      </div>

      <div class="right-icons">
        <img src="img/flag.png" alt="" />
        <span>ENG</span>
        <i class="ri-search-line search-toggle"></i>
      </div>

      <div class="search-overlay">
        <div class="search-box">
          <input
            type="text"
            placeholder="Type and hit Enter..."
            id="searchInput"
          />
          <i class="ri-close-line search-close"></i>
        </div>
      </div>
    </header>

    <div class="sidebar" id="sidebar">
      <div class="close-btn" id="closeBtn"><i class="ri-close-line"></i></div>
      <nav>
        <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">ABOUT</a></li>
          <li><a href="#">CONTACT</a></li>
        </ul>
      </nav>

      <div class="social">
        <span>IN</span>
        <span>FB</span>
        <span>YT</span>
      </div>
      <div class="extra"><p>© 2025 Hydro Flask. All Rights Reserved.</p></div>
    </div>

    <section class="hero">
      <div class="parallelogram"></div>

      <div class="hero-left">
        <div class="number">2025</div>
        <h2>
          BEST <br />
          INDUSTRIAL <br />
          DESIGN
        </h2>
        <div class="social">
          <span>IN</span>
          <span>FB</span>
          <span>YT</span>
        </div>
      </div>

      <div class="hero-right">
        <div class="card card-left">
          <div class="card-content">
            <h3>Hydro Flask 21oz</h3>
            <p>Standard Mouth Bottle</p>
          </div>
          <img src="img/img1.png" alt="" />
        </div>

        <div class="card card-middle">
          <div class="card-content">
            <h3>Hydro Flask 21oz</h3>
            <p>Standard Mouth Bottle</p>
          </div>
          <img src="img/img2.png" alt="" />
        </div>

        <div class="card card-right">
          <div class="card-content">
            <h3>Hydro Flask 21oz</h3>
            <p>Standard Mouth Bottle</p>
          </div>
          <img src="img/img3.png" alt="" />
        </div>
      </div>
    </section>

    <!-- ===== JS LINK ===== -->
    <script src="js/script.js"></script>
  </body>
</html>
